[package]
name = "taskotter-remote"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "LicenseRef-PolyForm-Strict-1.0.0"
description = "TaskOtter Remote runner and daemon foundation."

[dependencies]
clap = { version = "4.5.38", features = ["derive", "env"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
time = { version = "0.3.41", features = ["formatting", "macros", "serde-human-readable"] }
tokio = { version = "1.45.1", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.8.22"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "1.17.0", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.20.0"
