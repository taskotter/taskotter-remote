control_plane_url = "https://app.taskotter.example/api/remote"
runner_id = "local-dev-runner"
registration_token_env = "TASKOTTER_REMOTE_REGISTRATION_TOKEN"
credential_placeholder = "runner-scoped-credential-ref"
labels = ["local", "dev"]
max_concurrency = 1
allowed_working_groups = ["wg-dev"]
env_allowlist = ["PATH", "HOME", "TMPDIR"]
risky_action_allowlist = ["read_workspace", "write_job_workspace"]
heartbeat_interval_seconds = 30
job_timeout_seconds = 1800

[capability_overrides]
network_zone = "private-local"
local_tools = ["git", "cargo"]
mcp_host_modes = ["stdio"]

[[capability_overrides.local_llm_endpoints]]
id = "ollama-local"
provider = "ollama"
base_url = "http://127.0.0.1:11434"
model_ids = ["llama3.2"]
health_status = "unknown"

[[capability_overrides.external_agent_adapters]]
id = "codex-local"
runtime = "codex"
command_label = "codex"
supported_isolation_modes = ["temporary_isolated"]
supported_network_modes = ["deny_all"]

[[capability_overrides.allowlisted_command_adapters]]
id = "cargo-test"
command_label = "cargo"
allowed_args = ["test"]
allowed_env = ["PATH", "TMPDIR"]

[feature_flags]
local_tools_enabled = false
local_llm_enabled = false
external_agent_adapters_enabled = false
computer_use_enabled = false
