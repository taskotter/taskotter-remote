name: Contract Compatibility

on:
  pull_request:
    paths:
      - "src/**"
      - "fixtures/**"
      - "contract-compatibility.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/contract-compatibility.yml"
      - "scripts/check-contract-compatibility.sh"
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "fixtures/**"
      - "contract-compatibility.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/contract-compatibility.yml"
      - "scripts/check-contract-compatibility.sh"

permissions:
  contents: read

jobs:
  contract-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/check-contract-compatibility.sh
