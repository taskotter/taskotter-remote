name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "integration/**"
      - "issue/**"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: ./scripts/check-file-size.sh
